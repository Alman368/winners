map "$uri:$status" $frontend_cache_control {
    ~^/assets/.+:(?:200|206|304)$ "public, max-age=31536000, immutable";
    default "no-cache";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $frontend_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com; font-src 'self' data:; connect-src 'self' data: blob: https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /health {
        proxy_pass http://winners_backend:8000;
        proxy_set_header Host $host;
    }

    location /api/ {
        client_max_body_size 50M;
        proxy_read_timeout 600s;

        proxy_pass http://winners_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
