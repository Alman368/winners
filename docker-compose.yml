services:
  backend:
    build: ./backend
    container_name: winners_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - ENV=production
    volumes:
      - backend_cache:/app/data/cache
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5)
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s
    networks:
      - winners_network

  frontend:
    build: ./frontend
    container_name: winners_frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 5s
    networks:
      - winners_network
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"
      - "traefik.http.routers.winners.rule=Host(`${DOMAIN:?DOMAIN is required}`)"
      - "traefik.http.routers.winners.entrypoints=websecure"
      - "traefik.http.routers.winners.tls=true"
      - "traefik.http.routers.winners.tls.certresolver=letsencrypt"
      - "traefik.http.routers.winners.middlewares=winners-compress"
      - "traefik.http.middlewares.winners-compress.compress=true"
      - "traefik.http.services.winners.loadbalancer.server.port=80"

networks:
  winners_network:
    driver: bridge
  edge:
    external: true

volumes:
  backend_cache:
